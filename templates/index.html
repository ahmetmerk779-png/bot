<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Asistanım</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: sans-serif; margin: 0; height: 100vh; display: flex; flex-direction: column; }
        .ust-bar { background: #2c3e50; color: white; padding: 0.7rem; display: flex; justify-content: space-between; align-items: center; }
        .ust-bar a button { background: #e74c3c; color: white; border: none; padding: 0.4rem 0.8rem; border-radius: 4px; cursor: pointer; }
        .ana { display: flex; flex: 1; overflow: hidden; }
        .panel { background: #ecf0f1; width: 220px; padding: 0.5rem; overflow-y: auto; border-right: 1px solid #bdc3c7; display: none; }
        .panel.acik { display: block; }
        .sohbet { flex: 1; overflow-y: auto; padding: 0.5rem; }
        .mesaj { margin: 0.5rem 0; padding: 0.7rem; border-radius: 10px; }
        .soru { background: #3498db; color: white; text-align: right; }
        .cevap { background: #f1f1f1; }
        pre { white-space: pre-wrap; background: #fff; padding: 0.5rem; border-radius: 4px; }
        .alt-bar { background: #f8f9fa; padding: 0.7rem; border-top: 1px solid #ccc; display: flex; gap: 0.3rem; }
        textarea { flex: 1; height: 60px; font-size: 16px; }
        button { font-size: 16px; cursor: pointer; }
        .toggle-btn { background: #34495e; color: white; border: none; padding: 0.4rem 0.8rem; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="ust-bar">
        <span>🧠 Süper Asistan</span>
        <div>
            <button class="toggle-btn" onclick="document.getElementById('panel').classList.toggle('acik')">📁 Dosyalar</button>
            <a href="/yeni_sohbet"><button>🆕 Yeni Sohbet</button></a>
        </div>
    </div>
    <div class="ana">
        <div id="panel" class="panel">
            <h4>📂 Yüklenenler</h4>
            <ul>
                {% for d in dosyalar %}
                <li>{{ d.isim }} ({{ (d.boyut/1024)|round(1) }} KB)</li>
                {% endfor %}
            </ul>
            <form action="/yukle" method="post" enctype="multipart/form-data">
                <input type="file" name="dosya" style="width:100%; margin-bottom:0.3rem;">
                <button type="submit">Yükle</button>
            </form>
        </div>
        <div class="sohbet" id="sohbetAlani">
            {% for m in history %}
            <div class="mesaj soru"><strong>Sen:</strong><br>{{ m.soru }}</div>
            <div class="mesaj cevap">
                <strong>Asistan:</strong><br>
                <pre>{{ m.cevap }}</pre>
                {% if m.kod %}
                <form action="/onizle" method="post" target="_blank">
                    <input type="hidden" name="kod" value="{{ m.kod }}">
                    <button type="submit">▶️ Canlı Önizleme</button>
                </form>
                {% endif %}
            </div>
            {% endfor %}
        </div>
    </div>
    <div class="alt-bar">
        <form method="post" action="/sor" style="display: flex; width: 100%; gap: 0.3rem;">
            <textarea name="soru" placeholder="Ne yapmamı istersin?"></textarea>
            <button type="submit">Gönder</button>
        </form>
    </div>
    <script>
        window.onload = function() {
            var s = document.getElementById("sohbetAlani");
            s.scrollTop = s.scrollHeight;
        };
    </script>
</body>
</html>
