<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ Süper Asistan</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .header {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            padding: 0.8rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .header h2 { font-size: 1.4rem; display: flex; align-items: center; gap: 0.5rem; }
        .header-buttons { display: flex; gap: 0.5rem; }
        .btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            padding: 0.5rem 0.8rem;
            border-radius: 25px;
            font-size: 0.9rem;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }
        .btn:hover { background: rgba(255,255,255,0.2); }
        .btn-danger { background: rgba(220,53,69,0.6); }
        .btn-danger:hover { background: rgba(220,53,69,0.8); }
        .main { display: flex; flex: 1; overflow: hidden; }
        .sidebar {
            width: 260px;
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(15px);
            padding: 1rem;
            border-right: 1px solid rgba(255,255,255,0.1);
            overflow-y: auto;
            transition: 0.3s;
        }
        .sidebar h4 { margin-bottom: 0.5rem; opacity: 0.8; }
        .file-list { list-style: none; font-size: 0.85rem; }
        .file-list li { padding: 0.3rem 0; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .upload-form { margin-top: 1rem; }
        .upload-form input[type="file"] { width: 100%; color: white; margin-bottom: 0.5rem; }
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }
        .message {
            max-width: 85%;
            padding: 0.8rem 1rem;
            border-radius: 18px;
            animation: fadeIn 0.3s ease;
            word-wrap: break-word;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .user-msg {
            align-self: flex-end;
            background: #007bff;
            color: white;
            border-bottom-right-radius: 5px;
        }
        .bot-msg {
            align-self: flex-start;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.15);
            border-bottom-left-radius: 5px;
        }
        .bot-msg pre {
            background: rgba(0,0,0,0.4);
            padding: 0.7rem;
            border-radius: 12px;
            margin: 0.5rem 0;
            font-size: 0.85rem;
            white-space: pre-wrap;
            overflow-x: auto;
        }
        .code-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.5rem;
            flex-wrap: wrap;
        }
        .code-actions button {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.2rem;
        }
        .preview-frame {
            width: 100%;
            height: 300px;
            border: none;
            margin-top: 0.5rem;
            border-radius: 12px;
            background: white;
        }
        .input-area {
            padding: 0.8rem;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(15px);
            display: flex;
            gap: 0.5rem;
        }
        .input-area textarea {
            flex: 1;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 0.7rem;
            border-radius: 25px;
            resize: none;
            font-size: 1rem;
            outline: none;
        }
        .input-area textarea::placeholder { color: #ccc; }
        .input-area button {
            background: #28a745;
            border: none;
            color: white;
            padding: 0 1.2rem;
            border-radius: 25px;
            font-size: 1rem;
            cursor: pointer;
        }
        .loader {
            border: 3px solid rgba(255,255,255,0.2);
            border-top: 3px solid white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 0.8s linear infinite;
            display: inline-block;
            margin-left: 0.5rem;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @media (max-width: 600px) {
            .sidebar { position: fixed; left: -100%; z-index: 10; height: 100%; width: 240px; }
            .sidebar.open { left: 0; }
            .header h2 { font-size: 1.2rem; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h2>🧠 Süper Asistan</h2>
        <div class="header-buttons">
            <button class="btn" onclick="toggleSidebar()">📁</button>
            <a href="/yeni_sohbet"><button class="btn btn-danger">🆕 Yeni Sohbet</button></a>
        </div>
    </div>
    <div class="main">
        <div id="sidebar" class="sidebar">
            <h4>📂 Dosyalar</h4>
            <ul class="file-list">
                {% for d in dosyalar %}
                <li>{{ d.isim }} ({{ (d.boyut/1024)|round(1) }} KB)</li>
                {% else %}
                <li style="opacity:0.6;">Henüz dosya yok</li>
                {% endfor %}
            </ul>
            <form class="upload-form" action="/yukle" method="post" enctype="multipart/form-data">
                <input type="file" name="dosya">
                <button type="submit" class="btn" style="width:100%;">⬆️ Yükle</button>
            </form>
        </div>
        <div class="chat-area" id="chatArea">
            {% for m in history %}
            <div class="message user-msg"><strong>Sen:</strong> {{ m.soru }}</div>
            <div class="message bot-msg">
                <strong>🤖 Asistan:</strong>
                <pre>{{ m.cevap }}</pre>
                {% if m.kod %}
                <div class="code-actions">
                    <button onclick="copyCode(`{{ m.kod|replace('`','\\`') }}`)">📋 Kopyala</button>
                    <button onclick="downloadCode(`{{ m.kod|replace('`','\\`') }}`, 'kod.html')">💾 İndir</button>
                    <button onclick="showPreview(`{{ m.kod|replace('`','\\`') }}`, this)">👁️ Önizle</button>
                </div>
                <div class="preview-container" style="display:none;"></div>
                {% endif %}
            </div>
            {% endfor %}
        </div>
    </div>
    <div class="input-area">
        <form id="soruForm" action="/sor" method="post" style="display:flex; width:100%; gap:0.5rem;">
            <textarea name="soru" id="soruInput" placeholder="Sorunuzu yazın... (Araştırma için 'araştır' ile başlatın)" rows="1"></textarea>
            <button type="submit" id="gonderBtn">➤</button>
        </form>
    </div>
    <script>
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }
        function copyCode(code) {
            navigator.clipboard.writeText(code).then(() => alert('Kopyalandı!'));
        }
        function downloadCode(code, filename) {
            const blob = new Blob([code], {type: 'text/plain'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
        }
        function showPreview(code, btn) {
            const container = btn.parentElement.nextElementSibling;
            if (container.style.display === 'none' || !container.style.display) {
                container.style.display = 'block';
                container.innerHTML = '<iframe class="preview-frame" srcdoc="' + code.replace(/"/g, '&quot;') + '"></iframe>';
                btn.textContent = '❌ Kapat';
            } else {
                container.style.display = 'none';
                container.innerHTML = '';
                btn.textContent = '👁️ Önizle';
            }
        }
        const chatArea = document.getElementById('chatArea');
        chatArea.scrollTop = chatArea.scrollHeight;
        document.getElementById('soruForm').addEventListener('submit', function() {
            document.getElementById('gonderBtn').disabled = true;
            document.getElementById('gonderBtn').innerHTML = '<span class="loader"></span>';
        });
    </script>
</body>
</html>
