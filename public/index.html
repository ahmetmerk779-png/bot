<!-- Ana dashboard içine ekle -->
<div id="locationSection">
  <h3>📍 Konum Paylaşma / TPA</h3>
  
  <div id="locationShare">
    <h4>Konum Paylaş</h4>
    <input type="text" id="shareLocationTarget" placeholder="Hedef oyuncu (opsiyonel)" />
    <button id="shareLocationBtn">Konumumu Söyle</button>
    <button id="whereBtn">Neredesin?</button>
  </div>
  
  <div id="tpaSection">
    <h4>TPA İşlemleri</h4>
    <input type="text" id="tpaTarget" placeholder="Oyuncu adı" />
    <button id="tpaBtn">TPA At</button>
    <button id="tpacceptBtn">TPA Kabul Et</button>
    <button id="tpadenyBtn">TPA Reddet</button>
  </div>
  
  <div id="callSection">
    <h4>Oyuncu Çağır</h4>
    <input type="text" id="callTarget" placeholder="Oyuncu adı" />
    <button id="callBtn">Bana Gel (Çağır)</button>
  </div>
  
  <div id="waypointShareSection">
    <h4>Waypoint Konumu Paylaş</h4>
    <input type="text" id="shareWaypointName" placeholder="Waypoint adı" />
    <button id="shareWaypointBtn">Waypoint Konumunu Paylaş</button>
  </div>
</div>
