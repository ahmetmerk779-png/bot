<!DOCTYPE html>
<html>
<body>
    <h3>AI Composer</h3>
    <textarea id="task" placeholder="Ne kodlamamı istersin?"></textarea>
    <button onclick="run()">Çalıştır</button>
    <div id="out"></div>
    <script>
        async function run() {
            const task = document.getElementById('task').value;
            document.getElementById('out').innerText = "Çalışıyor...";
            const res = await fetch('/api/composer', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ task })
            });
            const data = await res.json();
            document.getElementById('out').innerText = data.success ? "Başarılı!" : "Hata: " + data.error;
        }
    </script>
</body>
</html>
