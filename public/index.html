<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ASMP // COMPOSER</title>
    <style>
        body { background: #121212; color: #fff; font-family: sans-serif; padding: 20px; }
        textarea { width: 100%; height: 150px; background: #1e1e1e; color: #0f0; border: 1px solid #333; }
        button { background: #0f0; border: none; padding: 10px; margin-top: 10px; cursor: pointer; }
        #log { margin-top: 20px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h3>ASMP // Kod Oluşturucu</h3>
    <textarea id="task" placeholder="Ne yapmamı istersin?"></textarea>
    <button onclick="run()">GÖNDER</button>
    <div id="log"></div>
    <script>
        async function run() {
            const log = document.getElementById('log');
            log.innerText = "İşleniyor...";
            const res = await fetch('/api/composer', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ task: document.getElementById('task').value })
            });
            const data = await res.json();
            log.innerText = data.success ? data.message : "HATA: " + data.error;
        }
    </script>
</body>
</html>
