<!DOCTYPE html>
<html lang="tr">
<head>
    <style>
        body { background: #0d0d0d; color: #e1e1e1; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; padding: 50px; }
        .cursor-frame { width: 800px; background: #161616; border: 1px solid #303030; border-radius: 8px; padding: 20px; }
        .header { font-size: 12px; color: #888; margin-bottom: 15px; border-bottom: 1px solid #303030; padding-bottom: 5px; }
        textarea { width: 100%; height: 100px; background: #000; color: #fff; border: 1px solid #303030; padding: 10px; border-radius: 4px; resize: none; }
        button { background: #007aff; border: none; color: #fff; padding: 10px 20px; border-radius: 4px; cursor: pointer; margin-top: 10px; }
        #output { margin-top: 20px; padding: 15px; background: #000; border: 1px solid #303030; border-radius: 4px; font-family: 'Consolas', monospace; font-size: 13px; color: #7fbf7f; white-space: pre-wrap; }
    </style>
</head>
<body>
    <div class="cursor-frame">
        <div class="header">AI_FORGE // COMPOSER_MODE // GEMINI_1.5_PRO</div>
        <textarea id="composer-input" placeholder="Modun için ne yapmak istersin? (Örn: Chest.java oluştur ve içine envanter mantığı ekle)"></textarea>
        <button onclick="runComposer()">Execute Composer</button>
        <div id="output">// Sistem hazır...</div>
    </div>

    <script>
        async function runComposer() {
            const out = document.getElementById('output');
            out.innerText = "Analiz ediliyor...";
            const res = await fetch('/api/composer', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ task: document.getElementById('composer-input').value })
            });
            const data = await res.json();
            out.innerHTML = data.success ? `✅ **Değişenler:** ${data.modified.join(', ')}\n\n${data.raw}` : `❌ Hata: ${data.error}`;
        }
    </script>
</body>
</html>
