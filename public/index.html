<!DOCTYPE html>
<html>
<body>
    <h3>AI Mühendislik İstasyonu</h3>
    <textarea id="cmd" style="width:100%; height:100px;"></textarea><br>
    <button onclick="gonder()">Çalıştır</button>
    <div id="out"></div>
    <script>
        async function gonder() {
            const komut = document.getElementById('cmd').value;
            const res = await (await fetch('/api/master', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({komut})})).json();
            document.getElementById('out').innerHTML = res.sonuc;
        }
    </script>
</body>
</html>
