<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>God Mode Engine</title>
    <style>
        body { margin: 0; background: #0a0a0c; color: #d1d1d1; font-family: 'Segoe UI', sans-serif; }
        #sidebar { position: fixed; left: 0; width: 250px; height: 100%; background: rgba(20, 20, 25, 0.9); backdrop-filter: blur(10px); border-right: 1px solid #333; }
        #shell { position: fixed; bottom: 0; width: 100%; height: 200px; background: rgba(0, 0, 0, 0.9); color: #00ff00; padding: 10px; overflow-y: auto; }
        #main { margin-left: 260px; padding: 20px; }
        .input-area { position: absolute; top: 10px; width: 100%; }
    </style>
</head>
<body>
    <div id="sidebar">☰ Dosya Ağacı</div>
    <div id="main">
        <input type="text" id="cmd" placeholder="Komutunu yaz ve Enter'a bas..." style="width: 80%; background: #1a1a1a; color: white; border: none; padding: 10px;">
    </div>
    <div id="shell">Sistem hazır...</div>
    <script>
        document.getElementById('cmd').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                fetch('/api/execute', { method: 'POST', body: JSON.stringify({ command: this.value }), headers: {'Content-Type': 'application/json'} });
                this.value = '';
            }
        });
    </script>
</body>
</html>
