<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Gemma AI Engine</title>
    <style>
        body { background: #050505; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; height: 100vh; margin: 0; padding: 20px; }
        #chat-history { flex: 1; overflow-y: auto; margin-bottom: 20px; padding: 10px; border: 1px solid #222; border-radius: 10px; background: #0a0a0c; }
        .input-area { display: flex; gap: 10px; }
        input { flex: 1; padding: 15px; background: #1a1a1a; border: 1px solid #333; color: white; border-radius: 8px; }
        button { padding: 10px 20px; background: #3b82f6; border: none; color: white; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="chat-history">Gemma hazır. Bir şeyler sor...</div>
    <div class="input-area">
        <input type="text" id="msg" placeholder="Mesajını yaz...">
        <button onclick="send()">GÖNDER</button>
    </div>
    <script>
        async function send() {
            const input = document.getElementById('msg');
            const chat = document.getElementById('chat-history');
            const text = input.value;
            chat.innerHTML += `<div><b>Sen:</b> ${text}</div>`;
            const res = await fetch('/api/chat', { method: 'POST', body: JSON.stringify({ message: text }), headers: {'Content-Type': 'application/json'} });
            const data = await res.json();
            chat.innerHTML += `<div style="color: #3b82f6;"><b>Gemma:</b> ${data.reply}</div>`;
            input.value = '';
            chat.scrollTop = chat.scrollHeight;
        }
    </script>
</body>
</html>
