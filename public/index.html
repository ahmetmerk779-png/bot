<!DOCTYPE html>
<html lang="tr">
<head>
    <style>
        body { background: #0a0a0c; color: white; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        
        /* Orta-Alt Mesaj Kutusu ve Buton */
        .input-container { position: absolute; bottom: 15%; width: 60%; display: flex; gap: 10px; }
        
        #cmd { width: 100%; padding: 15px; background: #1a1a1a; border: 1px solid #333; color: white; border-radius: 8px; font-size: 16px; }
        
        #send-btn { padding: 0 25px; background: #3b82f6; border: none; color: white; border-radius: 8px; cursor: pointer; font-weight: bold; }
        #send-btn:hover { background: #2563eb; }

        /* Shell Konsolu (Görünür olması için) */
        #shell { width: 80%; height: 200px; background: #000; color: #00ff00; border: 1px solid #333; padding: 10px; overflow-y: auto; margin-top: 20px; font-family: 'Courier New', monospace; }
    </style>
</head>
<body>

    <div class="input-container">
        <input type="text" id="cmd" placeholder="Komutunu buraya yaz...">
        <button id="send-btn">GÖNDER</button>
    </div>

    <div id="shell">Sistem bekleniyor...</div>

    <script>
        function sendMessage() {
            const input = document.getElementById('cmd');
            const shell = document.getElementById('shell');
            if (!input.value) return;
            
            shell.innerHTML += `<div>> ${input.value}</div>`;
            // Buradan sunucuya gönderim yapılacak
            input.value = '';
        }

        document.getElementById('send-btn').addEventListener('click', sendMessage);
        document.getElementById('cmd').addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
    </script>
</body>
</html>
