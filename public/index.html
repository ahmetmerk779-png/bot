<!DOCTYPE html>
<html lang="tr">
<head>
    <style>
        body { background: #0d1117; color: #c9d1d9; font-family: sans-serif; display: flex; height: 100vh; margin: 0; }
        #sidebar { width: 280px; background: #161b22; padding: 20px; border-right: 1px solid #30363d; }
        #main { flex: 1; display: flex; flex-direction: column; padding: 20px; }
        textarea { flex: 1; background: #010409; color: #58a6ff; border: 1px solid #30363d; padding: 15px; }
        .controls { display: flex; gap: 10px; margin-top: 10px; }
        button { background: #238636; color: white; border: none; padding: 10px; cursor: pointer; border-radius: 5px; }
    </style>
</head>
<body>
    <div id="sidebar">
        <h3>AI Mühendislik İstasyonu</h3>
        <input type="file" id="fileInput">
        <button onclick="uploadFile()">Dosya (RAG) Yükle</button>
    </div>
    <div id="main">
        <textarea id="editor" placeholder="Kodun burada..."></textarea>
        <div class="controls">
            <input id="cmd" placeholder="AI'ya görev ver..." style="flex:1;">
            <button onclick="gonder()">Çalıştır</button>
        </div>
        <div id="out" style="background:#000; height:200px; margin-top:10px; overflow-y:auto; padding:10px;"></div>
    </div>
    <script>
        async function gonder() {
            const komut = document.getElementById('cmd').value;
            const res = await (await fetch('/api/master', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({komut})})).json();
            document.getElementById('out').innerHTML += `<div>> ${komut}<br>${res.sonuc}</div>`;
        }
    </script>
</body>
</html>
