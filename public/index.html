<!-- Ana dashboard içine ekle -->
<div id="branchMineSection">
  <h3>⛏️ Branch Mining (Elmas Arama)</h3>
  
  <div id="branchMineControls">
    <h4>Yeni Branch Mining Başlat</h4>
    <input type="number" id="branchLength" placeholder="Uzunluk (blok)" value="50" />
    <input type="number" id="branchCount" placeholder="Dal Sayısı" value="5" />
    <select id="branchDirection">
      <option value="kuzey">Kuzey</option>
      <option value="doğu">Doğu</option>
      <option value="güney">Güney</option>
      <option value="batı">Batı</option>
    </select>
    <button id="startBranchMineBtn">Başlat</button>
    <button id="stopBranchMineBtn">Durdur</button>
  </div>
  
  <div id="branchMineProgressContainer">
    <h4>İlerleme</h4>
    <div class="progress-bar-container">
      <div id="branchMineProgress" class="progress-bar" style="width: 0%;">0%</div>
    </div>
    <p id="branchMineText">Dal: 0/0</p>
  </div>
</div>
