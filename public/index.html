<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>ASMP // COMPOSER</title>
    <style>
        body { background: #121212; color: #b3b3b3; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; padding-top: 50px; }
        .box { width: 650px; background: #181818; padding: 25px; border-radius: 12px; border: 1px solid #333; }
        textarea { width: 100%; height: 120px; background: #242424; color: #fff; border: none; padding: 15px; border-radius: 6px; box-sizing: border-box; }
        button { background: #1DB954; border: none; color: #000; padding: 12px 20px; border-radius: 20px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        #log { margin-top: 20px; color: #fff; background: #000; padding: 15px; border-radius: 6px; font-size: 13px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <div class="box">
        <h2>ASMP // Kod Oluşturucu</h2>
        <textarea id="task" placeholder="Örn: 1.21.8 için bir MusicMod.java oluştur..."></textarea>
        <button onclick="execute()">Execute Task</button>
        <div id="log">Sistem hazır...</div>
    </div>

    <script>
        async function execute() {
            const log = document.getElementById('log');
            log.innerText = "İşleniyor...";
            const res = await fetch('/api/composer', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ task: document.getElementById('task').value })
            });
            const data = await res.json();
            log.innerText = data.success ? "Değişen dosyalar: " + data.modified.join(', ') : "Hata: " + data.error;
        }
    </script>
</body>
</html>
