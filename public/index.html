<!DOCTYPE html>
<html>
<head>
  <title>Aesir Bot</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>🤖 Aesir Bot</h1>
      <span id="status">🟢 Çevrimiçi</span>
    </header>

    <div id="settings">
      <h2>⚙️ Ayarlar</h2>
      <form id="settingsForm">
        <input type="text" id="setBotName" placeholder="Bot İsmi">
        <input type="text" id="setServerHost" placeholder="Sunucu IP">
        <input type="number" id="setServerPort" placeholder="Port">
        <input type="text" id="setVersion" placeholder="Sürüm">
        <select id="setAuth">
          <option value="offline">Offline</option>
          <option value="microsoft">Microsoft</option>
        </select>
        <button type="submit">💾 Kaydet</button>
      </form>
    </div>

    <div id="console">
      <h2>📋 Konsol</h2>
      <div id="logContainer"></div>
      <div id="commandBox">
        <input type="text" id="commandInput" placeholder="Komut yaz... (ör: move 100 64 200)">
        <button id="sendCommand">Gönder</button>
      </div>
    </div>

    <div id="quick">
      <h2>⚡ Hızlı</h2>
      <button data-cmd="explore">🔍 Keşfet</button>
      <button data-cmd="stopfollow">⏹️ Takip Durdur</button>
      <button data-cmd="eat">🍖 Yemek</button>
      <button data-cmd="observe">👀 Gözlem</button>
    </div>

    <footer>
      <p>Powered by Mineflayer + Pathfinder</p>
    </footer>
  </div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/script.js"></script>
</body>
</html>
