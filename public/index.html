<div id="settings-area">
    <input type="text" id="ipInput" placeholder="Sunucu IP Gir">
    <button onclick="setConnection()">Bağlan</button>
</div>

<script>
    async function setConnection() {
        const ip = document.getElementById('ipInput').value;
        await fetch('/update-settings', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ host: ip })
        });
        alert('Sunucu ayarlandı: ' + ip);
    }
</script>
