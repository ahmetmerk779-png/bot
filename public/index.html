<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Otonom Geliştirici</title>
    <style>
        body { background: #0f0f0f; color: #d1d1d1; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        #chat-box { width: 100%; max-width: 600px; height: 400px; border: 1px solid #333; overflow-y: auto; padding: 15px; background: #161616; border-radius: 10px; margin-bottom: 15px; }
        .msg { margin-bottom: 12px; padding: 8px; border-radius: 5px; background: #222; }
        .input-group { width: 100%; max-width: 600px; display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; border-radius: 5px; border: 1px solid #444; background: #222; color: #fff; }
        button { padding: 10px 20px; background: #2563eb; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>Otonom Geliştirici Paneli</h2>
    <div id="chat-box"></div>
    <div class="input-group">
        <input type="text" id="userInput" placeholder="Görevi buraya yaz...">
        <button onclick="gonder()">Çalıştır</button>
    </div>

    <script>
        async function gonder() {
            const input = document.getElementById('userInput');
            const box = document.getElementById('chat-box');
            const mesaj = input.value;
            box.innerHTML += `<div class="msg"><b>Sen:</b> ${mesaj}</div>`;
            
            const res = await fetch('/api/komut', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ gorev: mesaj })
            });
            const data = await res.json();
            box.innerHTML += `<div class="msg"><b>Ajan:</b> ${data.sonuc}</div>`;
            input.value = '';
        }
    </script>
</body>
</html>
