<!-- index.html - 3D Viewer eklendi -->
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minecraft AI Bot</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>🤖 Minecraft AI Bot</h1>
      <span id="status">🟢 Çevrimiçi</span>
    </header>

    <!-- ============ 3D VIEWER ============ -->
    <div id="viewerContainer">
      <h2>🎮 3D Dünya Görünümü</h2>
      <div id="viewerFrame">
        <!-- prismarine-viewer buraya render alacak -->
        <iframe id="viewerIframe" src="/viewer" width="100%" height="500" frameborder="0"></iframe>
      </div>
      <p style="color: #888; font-size: 12px;">💡 Botun etrafındaki dünya gerçek zamanlı olarak gösteriliyor.</p>
    </div>

    <!-- ============ AYARLAR ============ -->
    <div id="settings-panel">
      <!-- ... (önceki ayarlar formu aynen) ... -->
    </div>

    <!-- ============ BOT DURUMU ============ -->
    <div id="botInfo">
      <!-- ... (önceki bot durumu aynen) ... -->
    </div>

    <!-- ============ KONSOL ============ -->
    <div id="console">
      <!-- ... (önceki konsol aynen) ... -->
    </div>

    <!-- ============ HIZLI KOMUTLAR ============ -->
    <div id="quickCommands">
      <!-- ... (önceki hızlı komutlar aynen) ... -->
    </div>

    <!-- ============ WAYPOINT ============ -->
    <div id="waypointSection">
      <!-- ... (önceki waypoint aynen) ... -->
    </div>

    <!-- ============ KEŞİF ============ -->
    <div id="discoveriesSection">
      <!-- ... (önceki keşif aynen) ... -->
    </div>

    <footer>
      <p>Minecraft AI Bot v2.0 | Powered by Groq | 3D Render: prismarine-viewer</p>
    </footer>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/script.js"></script>
</body>
</html>
