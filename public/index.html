<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>God Mode Engine</title>
    <style>
        body { background: #0a0a0c; color: #d1d1d1; font-family: 'Consolas', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        #chat-history { width: 80%; height: 60vh; background: #16161a; border-radius: 12px; padding: 20px; overflow-y: auto; margin-bottom: 20px; border: 1px solid #333; }
        .input-container { width: 80%; display: flex; gap: 10px; }
        #cmd { flex: 1; padding: 15px; background: #1a1a1a; border: 1px solid #444; color: white; border-radius: 8px; }
        #send-btn { padding: 10px 25px; background: #3b82f6; border: none; color: white; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="chat-history">Sistem hazır. Konuşmaya başlamak için bir şey yaz.</div>
    <div class="input-container">
        <input type="text" id="cmd" placeholder="Bir şey sor...">
        <button id="send-btn">GÖNDER</button>
    </div>
    <script>
        async function sendMessage() {
            const input = document.getElementById('cmd');
            const chat = document.getElementById('chat-history');
            const msg = input.value;
            chat.innerHTML += `<div><b>Sen:</b> ${msg}</div>`;
            const res = await fetch('/api/chat', { method: 'POST', body: JSON.stringify({ message: msg }), headers: {'Content-Type': 'application/json'} });
            const data = await res.json();
            chat.innerHTML += `<div style="color: #00ff00;"><b>Sistem:</b> ${data.reply}</div>`;
            input.value = '';
        }
        document.getElementById('send-btn').onclick = sendMessage;
    </script>
</body>
</html>
