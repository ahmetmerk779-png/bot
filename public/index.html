<!DOCTYPE html>
<html>
<body>
    <h2>Minecraft AI Yönetim Paneli</h2>
    <form action="/connect" method="POST">
        <input type="text" name="host" placeholder="Sunucu IP" required>
        <input type="text" name="username" placeholder="Bot İsmi" required>
        <input type="text" name="version" placeholder="1.21.8" required>
        <button type="submit">BAŞLAT</button>
    </form>
    <div id="logs" style="background:#000; color:#0f0; height:400px; overflow-y:scroll; padding:10px;"></div>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        socket.on('log', (msg) => {
            document.getElementById('logs').innerHTML += msg + '<br>';
        });
    </script>
</body>
</html>
