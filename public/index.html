<!DOCTYPE html>
<html>
<head>
    <style>
        body { margin:0; display:flex; height:100vh; background:#0d1117; color:#c9d1d9; font-family:monospace; }
        #sidebar { width:200px; border-right:1px solid #30363d; padding:10px; }
        #main { flex:1; display:flex; flex-direction:column; }
        #editor { flex:1; background:#010409; color:#58a6ff; width:100%; border:none; padding:10px; }
        #terminal { height:200px; background:#000; color:#0f0; padding:10px; overflow-y:auto; border-top:1px solid #30363d; }
    </style>
</head>
<body>
    <div id="sidebar"><h3>Dosyalar</h3><div id="file-list"></div></div>
    <div id="main">
        <textarea id="editor" placeholder="Kodunu düzenle..."></textarea>
        <div id="terminal"><div id="out"></div><input id="cmd" placeholder="Komut..."></div>
    </div>
    <script>
        async function loadFiles() {
            const files = await (await fetch('/api/dosyalar')).json();
            document.getElementById('file-list').innerHTML = files.map(f => `<button onclick="readFile('${f}')">${f}</button>`).join('<br>');
        }
        async function readFile(f) {
            const content = await (await fetch('/api/oku?file='+f)).text();
            document.getElementById('editor').value = content;
        }
        async function run() {
            const cmd = document.getElementById('cmd').value;
            const res = await (await fetch('/api/komut', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({gorev:cmd})})).json();
            document.getElementById('out').innerHTML += `<div>$ ${cmd}<br>${res.sonuc}</div>`;
        }
        document.getElementById('cmd').onkeypress = (e) => { if(e.key=='Enter') run(); };
        loadFiles();
    </script>
</body>
</html>
