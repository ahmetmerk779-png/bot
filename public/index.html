<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minecraft AI Bot</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>🤖 Minecraft AI Bot</h1>
      <span id="status">🟢 Çevrimiçi</span>
    </header>

    <!-- AYARLAR -->
    <div id="settings-panel">
      <h2>⚙️ Bağlantı Ayarları</h2>
      <form id="settingsForm">
        <input type="text" id="setBotName" placeholder="Bot İsmi" value="BenimAIBot">
        <input type="text" id="setServerHost" placeholder="Sunucu IP" value="voidforge763.mcsh.i">
        <input type="number" id="setServerPort" placeholder="Port" value="25565">
        <input type="text" id="setVersion" placeholder="Sürüm" value="1.8.9">
        <select id="setAuth">
          <option value="offline">Offline</option>
          <option value="microsoft">Microsoft</option>
        </select>
        <input type="number" id="setRenderDistance" placeholder="Render Distance" value="10">
        <button type="submit">💾 Kaydet ve Yeniden Başlat</button>
      </form>
    </div>

    <!-- BOT DURUMU -->
    <div id="botInfo">
      <h2>📊 Bot Durumu</h2>
      <p>İsim: <span id="botName">-</span></p>
      <p>Sunucu: <span id="serverInfo">-</span></p>
      <p>Can: <span id="health">-</span></p>
      <p>Açlık: <span id="food">-</span></p>
      <p>Koordinat: <span id="coords">-</span></p>
    </div>

    <!-- RADAR -->
    <div id="radarContainer">
      <h2>📡 Radar</h2>
      <canvas id="radarCanvas" width="400" height="400"></canvas>
      <p id="radarLegend">🟢 Oyuncu | 🔴 Düşman | 🟡 Hayvan | ⚪ Diğer</p>
    </div>

    <!-- KONSOL -->
    <div id="console">
      <h2>📋 Konsol</h2>
      <div id="logContainer"></div>
      <div id="commandBox">
        <input type="text" id="commandInput" placeholder="Doğal dil komut gönder...">
        <button id="sendCommand">Gönder</button>
      </div>
    </div>

    <!-- HIZLI KOMUTLAR -->
    <div id="quickCommands">
      <h2>⚡ Hızlı Komutlar</h2>
      <div id="addQuickCommand">
        <input type="text" id="newQuickLabel" placeholder="Buton Adı" />
        <input type="text" id="newQuickCommand" placeholder="Komut" />
        <button id="addQuickBtn">➕ Ekle</button>
      </div>
      <div id="quickCommandsList"></div>
    </div>

    <!-- WAYPOINT -->
    <div id="waypointSection">
      <h2>📍 Waypoint Yönetimi</h2>
      <div>
        <input type="text" id="wpName" placeholder="İsim">
        <input type="number" id="wpX" placeholder="X" value="0">
        <input type="number" id="wpY" placeholder="Y" value="64">
        <input type="number" id="wpZ" placeholder="Z" value="0">
        <button id="addWpBtn">Ekle</button>
        <button id="saveCurrentBtn">Burayı Kaydet</button>
      </div>
      <div>
        <input type="text" id="wpGoName" placeholder="Waypoint adı">
        <button id="goWpBtn">Git</button>
        <button id="listWpBtn">Listele</button>
      </div>
      <ul id="waypointList"></ul>
    </div>

    <!-- KEŞİF -->
    <div id="discoveriesSection">
      <h2>🗺️ Keşfedilen Yerler</h2>
      <ul id="discoveriesList"></ul>
    </div>

    <footer>
      <p>Minecraft AI Bot v2.0 | Powered by Groq</p>
    </footer>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/script.js"></script>
</body>
</html>
