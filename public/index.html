<!DOCTYPE html>
<html>
<body>
    <h2>AI Yönetim Paneli</h2>
    <form action="/connect" method="POST">
        <input type="text" name="host" placeholder="Sunucu IP" required>
        <input type="text" name="username" placeholder="Bot İsmi" required>
        <input type="text" name="version" placeholder="1.21.8" required>
        <button type="submit">BAŞLAT VE OYUNA GİR</button>
    </form>
    <div id="logs" style="background:black; color:lime; height:300px; overflow-y:scroll; border:1px solid #333;"></div>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        socket.on('log', (msg) => {
            const logDiv = document.getElementById('logs');
            logDiv.innerHTML += msg + '<br>';
            logDiv.scrollTop = logDiv.scrollHeight;
        });
    </script>
</body>
</html>
