<!DOCTYPE html>
<html>
<body>
    <h2>Canlı Bot Konsolu</h2>
    <div id="logs" style="background:#000; color:#0f0; height:300px; overflow:auto;"></div>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        socket.on('log', (msg) => {
            document.getElementById('logs').innerHTML += msg + '<br>';
        });
    </script>
</body>
</html>
